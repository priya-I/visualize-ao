<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>D3 testing</title>
		<script type="text/javascript" src="d3/d3.v3.js"></script>
		<link rel="stylesheet" type="text/css" href="style.css">
	</head>
	<body>
		<script type="text/javascript">
		var dataset=[ 25, 17, 15, 26];


        var w=500;
        var h=100;
		var svg=d3.select("body")
			.append("svg")
			.attr("width",w)
			.attr("height",h);
			
		var circles=svg.selectAll("circle")
		.data(dataset)
		.enter()
		.append("circle");

		circles
		.attr("class","pumpkin")
		.attr("cx",function(d,i){
			return (i*50)+50;
		})
		.attr("cy",h/2)
		.attr("r",function(d){
				return d;
			})			
		.attr("fill",function(d){
			 return "rgb(0, 0, " + (d * 10) + ")";
		})
		.attr("opacity",function(d,i){
			return (i*0.1)+0.2;
		});

		svg.selectAll("text")
		.data(dataset)
		.enter()
		.append("text")
		.text(function(d){
			return d;
		})
		.attr({
			"x":function(d,i){
				return (i*50)+43;
			},
			"y":h/2+5
		})
		.style({
			"font-family":"sans-serif",
			"font-size":"11px",
			"fill":"red"
		})
		</script>
		
	</body>
</html>
