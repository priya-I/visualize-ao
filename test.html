            <div class="navbar">

                    <ul class="nav">

                        <li><a id="brinjal" href="#">Brinjal</a></li>
                        <li><a id="castor" href="#">Castor</a></li>
                        <li><a id="chilli" href="#">Chilli</a></li>
                        <li><a id="cotton" href="#">Cotton</a></li>
                        <li><a id="cumin" href="#">Cumin</a></li>
                        <li><a id="garlic" href="#">Garlic</a></li>
                        <li><a id="gram" href="#">Gram</a></li>
                        <li><a id="maize" href="#">Maize</a></li>
                        <li><a id="mustard" href="#">Mustard</a></li>
                        <li><a id="onion" href="#">Onion</a></li>
                        <li><a id="paddy" href="#">Paddy</a></li>

    <div class="container-fluid">
    <div class="row-fluid">
        <div class="span9"> 
        </div>

        <script type="text/javascript">
            var alldata=All;
            var actualW=900;
            var extendedH=700;
            var w=800;
            var h=600;
            var padding=20;
            var barPadding=1;
            var svg=d3.selectAll(".span9")
                          .append("svg")
                          .attr("width",actualW)
                          .attr("height",extendedH);
                        
            var barWidth=(w-padding)/alldata.length-barPadding;
                
            var startdate=new Date(alldata[0]['date'])
            
            var enddate=new Date(alldata[alldata.length-1]['date'])
                
            var minSess=d3.min(alldata,function(d){
                return parseInt(d['sessions']);
            })

            var maxSess=d3.max(alldata,function(d){
                return parseInt(d['sessions']);
            })

            var minDur=d3.min(alldata,function(d){
                return parseInt(d['duration']);
            })

            var maxDur=d3.max(alldata,function(d){
                return parseInt(d['duration']);
            })
            
            //Creating the scales
            var timescale=d3.time.scale()
                        .domain([startdate,enddate])
                        .range([padding,w+padding]);        

            var sessionscale=d3.scale.linear()
                          .domain([minSess,maxSess])
                          .range([h-padding,padding]);

            var colorScale=d3.scale.linear()
                            .domain([minDur,maxDur])
                            .range(["#FFEC8B", "#FF3300"])
                            .interpolate(d3.interpolateLab);

            var cropMap=[]
            cropMap["cotton"]=Cotton
            cropMap["all"]=All
            cropMap["brinjal"]=Brinjal
            cropMap["castor"]=Castor
            cropMap["chilli"]=Chilli
            cropMap["cumin"]=Cumin
            cropMap["gram"]=Gram
            cropMap["garlic"]=Garlic
            cropMap["mustard"]=Mustard
            cropMap["onion"]=Onion
            cropMap["paddy"]=Paddy
            cropMap["wheat"]=Wheat
            cropMap["maize"]=Maize
            var cropname='all';
            var ddata=All;
              ddata=_.sortBy(ddata,function(d){
                return new Date(d['date']);
            });
     
                //Main Crop Chart
                barChart=svg.selectAll("#main g")
                        .data(ddata);

                barChart.enter()
                    .append("g")
                    .attr("class","main")
                    .append("rect")
                    
                //barChart.enter().append("rect")
                barChart.select("rect")
                        .transition().duration(500)
                        .attr({
                        "x":function(d,i){
                            relX=padding+i*(barWidth+barPadding);
                            return relX;
                        },
                        "y":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return sessions;
                        },          
                        
                        "height":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return h-padding-sessions;
                        },
                        "fill": function(d) {
                            return colorScale(parseInt(d['duration']));
                        },
                        "width":barWidth,
                        opacity:1
                    });     

                //Tooltip on mouse over
                var div=d3.select("body").append("div")
                .attr("class","tooltip")
                .style("opacity",0);

                cropdat=svg.append("text")
                .attr({

                    "x":w/2-padding-100,
                    "y":20
                })
                .style({
                    "opacity":0,
                    "wordWrap":"break-word"

                })

                barChart.on("mouseover",function(d){
                    d3.select(this)
                    .select("rect")
                    .transition()
                    .attr({
                        "width":15,
                        "fill":"black"
                    });
                    div.transition()
                        .style("opacity",.9)
                    div.html(
                        "Duration: "+d['duration']+" s, Sessions: "+d['sessions']+"<br/>"
                        +"Time: "+d['date'])
                        .style("left",(d3.event.pageX)+"px")
                        .style("top",(d3.event.pageY)+"px");
                    })
                .on("mouseout",function(){
                    d3.select(this)
                    .select("rect")
                    .transition()
                    .attr({
                        "width":barWidth,
                        "fill": function(d) {
                            return colorScale(parseInt(d['duration']));
                        }
                    })
                    div.transition()
                    .duration(500)
                    .style("opacity",0)
                    
                })
                .on("click",function(d){
                    cropdat.text(d['crops'])
                    .transition()
                    .duration(500)
                    .style("opacity",1)
                })
                
            
                //Creating the axes
                var xAxis = d3.svg.axis()
                      .scale(timescale)
                      .ticks(10)
                      .orient("bottom")
                      .tickFormat(d3.time.format("Week %W, %y"));
                      //.ticks(d3.time.weeks,4)
   
                var yAxis = d3.svg.axis()
                    .scale(sessionscale) 
                    .tickSize(0,0,0)
                    .ticks(5) 
                    .orient("right");
                               
                 //Adding the X-axis
                XaxisGroup=svg.append("g")
                        .attr("class","xaxis")
                        .attr("transform","translate(0,"+(h-padding)+")")
                        .call(xAxis);

                XaxisGroup.selectAll("text")                        
                        .style("class","axistext")
                        .attr({
                            "transform":"rotate(-10)"
                        })
                        
                svg.append("text")
                .attr("class","x label")
                .attr("text-anchor","end")
                .attr("x",w/2)
                .attr("y",extendedH)
                .text("Weeks");

                svg.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "end")
                .attr("y", 6)
                .attr("dy", ".45em")
                .attr("transform", "rotate(-90)")
                .text("No. of sessions");

                YaxisGroup=svg.append("g")
                        .attr("class","yaxis")
                        .attr("transform","translate("+padding+",0)")
                        .call(yAxis);   

                YaxisGroup.selectAll("text")                        
                        .style("class","axistext")
                        .attr({
                            "transform":"rotate(-10)"
                        })

            d3.selectAll("a")
            .on("click",function(d){
                crop=d3.select(this).attr("id")
                cropdata=cropMap[crop]
                cropdata=_.sortBy(cropdata,function(d){
                  return new Date(d['date']);
               })
                minSess=d3.min(cropdata,function(d){
                    return parseInt(d['sessions']);
                })

                maxSess=d3.max(cropdata,function(d){
                    return parseInt(d['sessions']);
                })
                sessionscale.domain([minSess,maxSess]);
                svg.select(".yaxis").transition().duration(2000).call(yAxis)
                newChart=barChart.data(cropdata)
                .select("rect")
                .transition().duration(2000).delay(200)
                .attr({
                        "x":function(d,i){
                            relX=padding+i*(barWidth+barPadding);
                            return relX;
                        },
                        "y":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return sessions;
                        },          
                        
                        "height":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return h-padding-sessions;
                        },
                        "fill": function(d) {
                            return colorScale(parseInt(d['duration']));
                        },
                       
                    });     
                     
                newChart.exit().transition().duration(500)
                .selectAll("#main g")
                .attr("height", 0)
                .remove();   
                            
            })
            
    </script>
