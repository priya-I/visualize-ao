<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Visualize-AO</title>
		<h1 class="small">Number of calls made per week from August 2011-September 2012</h1>
		<script type="text/javascript" src="d3/d3.v3.js"></script>
		<script type="text/javascript" src="bardata.json"></script>
		<link rel="stylesheet" type="text/css" href="stylesheets/bootstrap.css"/>
		<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
		<style type="text/css">
			div.tooltip {   

				  position: absolute;           
				  text-align: center;           
				  width: 60px;                  
				  height: 60px;                 
				  padding: 2px;	             
				  font: 12px sans-serif;        
				  background: #FFC4EB;   
				  border: 0px;      
				  border-radius: 8px;           
				  pointer-events: none;         
			}
			.chart {
				shape-rendering: crispEdges;
			}

			text {
				
				font: 8px sans-serif;
				
			}
			
			path .domain { 
			  fill: none; 
			  stroke: black; 
			  stroke-width: 2; 
			} 

		</style>
	</head>

	<body>
		<script type="text/javascript">
		
			var ddata=bars;
        	var w=1000;
        	var h=700;
        	var padding=30;
        	var barPadding=5;
			var svg=d3.select("body")
					  .append("svg")
					  .attr("width",w)
				 	  .attr("height",h);
				 	

			var barWidth=(w/ddata.length);
			startdate=new Date(2011,08,19);
		    enddate=new Date(2012,09,01);
			//Creating the scales
			var timescale=d3.time.scale()
								.domain([startdate,enddate])
								.range([padding,w+1000+padding]);		

			var sessionscale=d3.scale.linear()
							  .domain([d3.min(ddata,function(d){ 
							  				sessions=parseInt(d['sessions']);
							  				return sessions; 
							  			}),d3.max(ddata,function(d){ 
							  					sessions=parseInt(d['sessions']);
							  					return sessions; } ) ] )
							  .range([h-padding,padding]);

			var colorScale=d3.scale.linear()
							.domain([d3.min(ddata,function(d){return parseInt(d['duration'])}),
									d3.max(ddata,function(d){return parseInt(d['duration'])})
									])
							.range([0,256]);


			//Creating the axes
		    var xAxis = d3.svg.axis()
                  .scale(timescale)
                  .ticks(0)
               //   .tickFormat(d3.time.format('%W'))
                  .tickSize(1)
                  .tickSubdivide(5)
                  //.tickPadding(1)
                  .orient("vertical");
            
            var yAxis = d3.svg.axis()
            	.scale(sessionscale) 
            	.ticks(0,1)               
            	.tickSize(1)
            	.orient("left");

           
			 //Adding the X-axis
			XaxisGroup=svg.append("g")
					.attr("transform","translate(0,"+(h-padding)+")")
					.call(xAxis);

			XaxisGroup.selectAll("text")						
					.style("class","axistext")
					.attr({
						//"transform":"rotate(-10)"
					});
			YaxisGroup=svg.append("g")
					.attr("transform","translate("+padding+",0)")
					.call(yAxis);	


			
			//Binding the data with the g and text elements
			var barChart=svg.selectAll("g")
					.data(ddata)
					.enter()
					.append("g");

			barChart.append("rect")
					.attr({
					"x":function(d,i){
						//console.log(d['week'],i);
						return (i*21)+(w/ddata.length);
					},
					"y":function(d){
						sessions=parseInt(d['sessions'])/10;
						return h-sessions-30;
					},			
					
					"height":function(d,i){
						sessions=parseInt(d['sessions'])/10;
						return sessions;
					},
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(color)+",0,0)";
					},
					"width":(w/ddata.length)-barPadding,
					opacity:1
				});		

			//Tooltip on mouse over
			var div=d3.select("body").append("div")
            .attr("class","tooltip")
            .style("opacity",0);

			barChart.on("mouseover",function(d){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":20,
					"fill":"#CD5555"
				});
				div.transition()
					.style("opacity",.9)
				div.html(
					"Duration: "+d['duration']+" s, Sessions: "+d['sessions']+"<br/>")
					.style("left",(d3.event.pageX)+"px")
					.style("top",(d3.event.pageY)+"px");
				})
			.on("mouseout",function(){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":(w/ddata.length)-barPadding,
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(color)+",0,0)";
					}
				})
				div.transition()
				.duration(500)
				.style("opacity",0)
				
			})
			

			
			
	</script>
	</body>
</html>
