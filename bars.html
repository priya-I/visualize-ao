<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Visualize-AO</title>
		<!--<h1 class="small">Number of calls made per week from August 2011-September 2012</h1>-->
		<script type="text/javascript" src="d3/d3.v3.js"></script>
		<script type="text/javascript" src="barData2.json"></script>
		<link rel="stylesheet" type="text/css" href="stylesheets/bootstrap.css"/>
		<link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
		<style type="text/css">
			div.tooltip {   

				  position: absolute;           
				  text-align: center;           
				  width: 120px;                  
				  height: 60px;                 
				  padding: 2px;	             
				  font: 12px sans-serif;        
				  background: #C0C0C0;   
				  border: 0px;      
				  border-radius: 8px;           
				  pointer-events: none;         
			}
			.chart {
				shape-rendering: crispEdges;
			}

			text {
				font-weight: strong;
				font: 10px sans-serif;
				
			}
			
			path.domain { 
			  fill: none; 
			  stroke: black; 
			  stroke-width: 1; 
			} 

			.label{
				font: 15px sans-serif;
				font-weight: strong
			}
		</style>
	</head>

	<body>
		
		<script type="text/javascript">
		
			var ddata=bars;
			var actualW=820;
        	var w=800;
        	var h=600;
        	var extendedH=650;
        	var padding=20;
        	var barPadding=1;
			var svg=d3.select("body")
					  .append("svg")
					  .attr("width",actualW)
				 	  .attr("height",extendedH);
				 	
			var barWidth=(w-padding)/ddata.length-barPadding;
			console.log(barWidth);
			startdate=d3.min(ddata,function(d){
				return new Date(d['date'])	
			});
		    enddate=d3.max(ddata,function(d){
				return new Date(d['date'])
			});
			
			//Creating the scales
			var timescale=d3.time.scale()
								.domain([startdate,enddate]).nice()
								.range([padding,w+padding]);		

			var sessionscale=d3.scale.linear()
							  .domain([d3.min(ddata,function(d){ 
							  				sessions=parseInt(d['sessions']);
							  				return sessions; 
							  			}),d3.max(ddata,function(d){ 
							  					sessions=parseInt(d['sessions']);
							  					return sessions; } ) ] )
							  .range([h-padding,padding]);

			var colorScale=d3.scale.linear()
							.domain([d3.min(ddata,function(d){return parseInt(d['duration'])}),
									d3.max(ddata,function(d){return parseInt(d['duration'])})
									])
							.range([0,256]);
			
			//Binding the data with the g and text elements
			var barChart=svg.selectAll("g")
					.data(ddata)
					.enter()
					.append("g");

			barChart.append("rect")
					.attr({
					"x":function(d,i){
						relX=padding+i*(barWidth+barPadding);
						return relX;
					},
					"y":function(d){
						sessions=sessionscale(parseInt(d['sessions']));
						return sessions;
					},			
					
					"height":function(d){
						sessions=sessionscale(parseInt(d['sessions']));
						return h-padding-sessions;
					},
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(256-color)+","+String(128-color)+",256)";
					},
					"width":barWidth,
					opacity:1
				});		

			//Tooltip on mouse over
			var div=d3.select("body").append("div")
            .attr("class","tooltip")
            .style("opacity",0);

            var cropdat=svg.append("text")
            .attr({

            	"x":w/2-padding-100,
            	"y":20
            })
            .style({
            	"opacity":0,
            	"wordWrap":"break-word"

            })

			barChart.on("mouseover",function(d){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":15,
					"fill":"orange"
				});
				div.transition()
					.style("opacity",.9)
				div.html(
					"Duration: "+d['duration']+" s, Sessions: "+d['sessions']+"<br/>"
					+"Time: "+d['date'])
					.style("left",(d3.event.pageX)+"px")
					.style("top",(d3.event.pageY)+"px");
				})
			.on("mouseout",function(){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":barWidth,
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(256-color)+","+String(128-color)+",256)";
					}
				})
				div.transition()
				.duration(500)
				.style("opacity",0)
				
			})
			.on("click",function(d){
				cropdat.text(d['crops'])
				.transition()
				.duration(500)
				.style("opacity",1)
			})
			
			//Creating the axes
		    var xAxis = d3.svg.axis()
                  .scale(timescale)
                  .orient("bottom")
               	  .ticks(d3.time.weeks,4)
                  .tickFormat(d3.time.format("Week %W, %y"));
                             
            
            var yAxis = d3.svg.axis()
            	.scale(sessionscale) 
               	.tickSize(0,0,0)
               	.ticks(5) 
            	.orient("right");
               	

           
			 //Adding the X-axis
			XaxisGroup=svg.append("g")
					.attr("transform","translate(0,"+(h-padding)+")")
					.call(xAxis);

			XaxisGroup.selectAll("text")						
					.style("class","axistext")
					.attr({
						"transform":"rotate(-10)"
					})
					
			svg.append("text")
			.attr("class","x label")
			.attr("text-anchor","end")
			.attr("x",w/2)
			.attr("y",extendedH)
			.text("Weeks");

			svg.append("text")
		    .attr("class", "y label")
		    .attr("text-anchor", "end")
		    .attr("y", 6)
		    .attr("dy", ".75em")
		    .attr("transform", "rotate(-90)")
		    .text("No. of sessions");

					
			YaxisGroup=svg.append("g")
					.attr("transform","translate("+padding+",0)")
					.call(yAxis);	

			YaxisGroup.selectAll("text")						
					.style("class","axistext")
					.attr({
						"transform":"rotate(-10)"
					})


			
	</script>

	</body>
</html>
