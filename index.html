        <script type="text/javascript">
            var sDonut=[];
            var dDonut=[];
            var donutdata=cropstop;
            var alldata=All;
            var actualW=600;
            var extendedH=400;
            var w=500;
            var h=400;
            var padding=20;
            var crop="all"
            var barPadding=1;
            var period="all"
            var svg=d3.selectAll(".bars")
                          .append("svg")
                          .attr("width",actualW)
                          .attr("height",extendedH);
            
            var barWidth=(w-padding)/alldata.length-barPadding;
                
            var startdate=new Date(alldata[0]['date']);
            
            var enddate=new Date(alldata[alldata.length-1]['date']);
                
            var minSess=d3.min(alldata,function(d){
                return parseInt(d['sessions']);
            })

            var maxSess=d3.max(alldata,function(d){
                return parseInt(d['sessions']);
            })

            var minDur=d3.min(alldata,function(d){
                return parseInt(d['duration']);
            })

            var maxDur=d3.max(alldata,function(d){
                return parseInt(d['duration']);
            })
            
            //Creating the scales
            var timescale=d3.time.scale()
                        .domain([startdate,enddate])
                        .range([padding,w+padding]);        

            var sessionscale=d3.scale.linear()
                          .domain([minSess,maxSess])
                          .range([h-padding,padding]);

            var colorScale=d3.scale.linear()
                            .domain([minDur,maxDur])
                            .range(["#FFEC8B", "#FF3300"])
                            .interpolate(d3.interpolateLab);

            var cropMap=[]
            cropMap["cotton"]=Cotton
            cropMap["all"]=All
            cropMap["brinjal"]=Brinjal
            cropMap["castor"]=Castor
            cropMap["chilli"]=Chilli
            cropMap["cumin"]=Cumin
            cropMap["gram"]=Gram
            cropMap["garlic"]=Garlic
            cropMap["mustard"]=Mustard
            cropMap["onion"]=Onion
            cropMap["paddy"]=Paddy
            cropMap["wheat"]=Wheat
            cropMap["maize"]=Maize
            var cropname='all';
            donutExtract();
            var ddata=All;
            //first donut
            var piw = 160,
                pih = 200,
                pir = Math.min(piw, pih) / 2;

            var color = d3.scale.category20();

            var pie = d3.layout.pie()
                .sort(null);

            var arc = d3.svg.arc()
                .innerRadius(pir - 50)
                .outerRadius(pir - 20);

            var svgdonut = d3.select(".donut1").append("svg")
                .attr("width", piw)
                .attr("height", pih)
                .append("g")
                .attr("transform", "translate(" + piw / 2 + "," + pih / 2 + ")");
                svgdonut.append("text").text("Sessions").style("text-anchor", "middle");


            var path1 = svgdonut.selectAll("g")
                .data(pie(sDonut['all']))
                .enter().append("path")
                .attr("fill", function(d, i) { return color(i); })
                .attr("d", arc)
                .each(function(d) { this._current = d; }); // store the initial values

            //d3.selectAll("a").on("click", change);

            //legend
              var labels=["Announcements","Experience Sharing","Questions and Answers","Radio"];
           
            //second donut
            var svgdonut2 = d3.select(".donut2").append("svg")
                .attr("width", piw)
                .attr("height", pih)
                .append("g")
                .attr("transform", "translate(" + piw / 2 + "," + pih / 2 + ")");
                svgdonut2.append("text").text("Duration").style("text-anchor", "middle");

            var path2 = svgdonut2.selectAll("g")
                .data(pie(sDonut['all']))
                .enter().append("path")
                .attr("fill", function(d, i) { return color(i); })
                .attr("d", arc)
                .each(function(d) { this._current = d; }); // store the initial values


            //legend
              var legend2 = d3.select(".donut2").append("svg")
                  .attr("class", "legend")
                  .attr("width", pir * 2)
                  .attr("height", pir * 2)
                  .selectAll("g")
                  .data(color.domain().slice().reverse())
                  .enter().append("g")
                  .attr("transform", function(d, i) { return "translate(0," + i * 20 + ")"; });

              legend2.append("rect")
                  .attr("width", 18)
                  .attr("height", 18)
                  .style("fill", color);

              legend2.append("text")
                  .attr("x", 24)
                  .attr("y", 9)
                  .attr("dy", ".35em")
                  .text(function(d,i) { return labels[i] });

            ddata=_.sortBy(ddata,function(d){
                return new Date(d['date']);
            });
     
                //Main Crop Chart
                barChart=svg.selectAll("rect")
                        .data(ddata);

                barChart.enter()
                        .append("rect")
                        .transition().duration(500)
                        .attr({
                        "x":function(d,i){
                            relX=padding+i*(barWidth+barPadding);
                            return relX;
                        },
                        "y":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return sessions;
                        },          
                        
                        "height":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return h-padding-sessions;
                        },
                        "fill": function(d) {
                            return colorScale(parseInt(d['duration']));
                        },
                        "width":barWidth,
                        opacity:1
                    });     

                //Tooltip on mouse over
                var div=d3.select("body").append("div")
                .attr("class","tooltip")
                .style("opacity",0);

                cropdat=svg.append("text")
                .attr({
                    "x":w/2-padding-100,
                    "y":20
                })
                .style({
                    "opacity":0,
                    "wordWrap":"break-word"

                })

                barChart.on("mouseover",function(d){
                    d3.select(this)
                    .transition()
                    .attr({
                        "width":15,
                        "fill":"black"
                    });
                    div.transition()
                        .style("opacity",.9)
                    div.html(
                        "Duration: "+d['duration']+" s, Sessions: "+d['sessions']+"<br/>"
                        +"Time: "+d['date'])
                        .style("left",(d3.event.pageX)+"px")
                        .style("top",(d3.event.pageY)+"px");
                    })
                .on("mouseout",function(){
                    d3.select(this)
                    .transition()
                    .attr({
                        "width":barWidth,
                        "fill": function(d) {
                            return colorScale(parseInt(d['duration']));
                        }
                    })
                    div.transition()
                    .duration(500)
                    .style("opacity",0)
                    
                })
                .on("click",function(d){
                    cropdat.text(d['crops'])
                    .transition()
                    .duration(500)
                    .style("opacity",1)
                })
                
            
                //Creating the axes
                var xAxis = d3.svg.axis()
                      .scale(timescale)
                      .ticks(10)
                      .orient("bottom")
                      .tickFormat(d3.time.format("%b %y"));
                      
                var yAxis = d3.svg.axis()
                    .scale(sessionscale) 
                    .tickSize(0,0,0)
                    .ticks(5) 
                    .orient("right");
                               
                 //Adding the X-axis
                XaxisGroup=svg.append("g")
                        .attr("class","xaxis")
                        .attr("transform","translate(0,"+(h-padding)+")")
                        .call(xAxis);

                XaxisGroup.selectAll("text")                        
                        .style("class","axistext")
                        .attr({
                            "transform":"rotate(-10)"
                        })
                        
                svg.append("text")
                .attr("class","x label")
                .attr("text-anchor","end")
                .attr("x",w/2)
                .attr("y",extendedH)
                .text("Months");

                svg.append("text")
                .attr("class", "y label")
                .attr("text-anchor", "end")
                .attr("y", 6)
                .attr("dy", ".45em")
                .attr("transform", "rotate(-90)")
                .text("No. of sessions");

                YaxisGroup=svg.append("g")
                        .attr("class","yaxis")
                        .attr("transform","translate("+padding+",0)")
                        .call(yAxis);   

                YaxisGroup.selectAll("text")                        
                        .style("class","axistext")
                        .attr({
                            "transform":"rotate(-10)"
                        })

                d3.selectAll("button")
                .on("click",function(d){
                    
                    crop=d3.select(this).attr("id");
                    path1 = path1.data(pie(sDonut[crop])); // update the data
                    path1.transition().duration(750).attrTween("d", arcTween); // redraw the arcs
                    path2 = path2.data(pie(dDonut[crop])); // update the data
                    path2.transition().duration(750).attrTween("d", arcTween); // redraw the arcs
                    //change circles on the map
                     for(i=0;i<circles.length;i++) {
                        map.removeLayer(circles[i]);
                    }  
                    circles = new Array();
                    //add new based on crop selected
                    drawcircle(crop);
                    cropdata=cropMap[crop];
                    cropdata=filterDatabyYear(cropdata);
                    //Redraw bar chart
                    redraw(cropdata);
                });

                d3.selectAll("input")
                .on("change",function(d){
                    period=d3.select(this).attr("value");
                    cropdata=cropMap[crop];
                    newdata=filterDatabyYear(cropdata);
                    redraw(newdata);
                });

            function filterDatabyYear(dat){
                var newdat=[];
                if(period=='all'){
                    return dat;
                }
                for(i=0;i<dat.length;i++){
                    tempdate=new Date(dat[i]['date']);
                    if(tempdate.getFullYear()==period){
                        newdat.push(dat[i]);
                    }    
                }
                return newdat;
            }

            function redraw(cropdata){
                console.log(cropdata);
                cropdata=_.sortBy(cropdata,function(d){
                  return new Date(d['date']);
               });

                //X-Axis Redraw
                startdate=new Date(cropdata[0]['date']);
                enddate=new Date(cropdata[cropdata.length-1]['date']);
                timescale.domain([startdate,enddate]);
                svg.select(".xaxis").transition().duration(2000).call(xAxis);

                //Y-Axis Redraw
                minSess=d3.min(cropdata,function(d){
                    return parseInt(d['sessions']);
                })

                maxSess=d3.max(cropdata,function(d){
                    return parseInt(d['sessions']);
                })
                sessionscale.domain([minSess,maxSess]);
                svg.select(".yaxis").transition().duration(2000).call(yAxis);

                barChart=svg.selectAll("rect")
                        .data(cropdata);
                barChart.enter()
                        .insert("rect")
                barChart.transition()
                        .duration(1000)
                        .attr({
                        "x":function(d,i){
                            relX=padding+i*(barWidth+barPadding);
                            return relX;
                        },
                        "y":function(d){
                            sessions=sessionscale(parseInt(d['sessions']));
                            return sessions;
                        },
                        "height":function(d){
                                sessions=sessionscale(parseInt(d['sessions']));
                                return h-padding-sessions;
                         },
                        "fill": function(d) {
                             return colorScale(parseInt(d['duration']));
                         }
                          })       
                        .selectAll("rect")   
                        .attr({
                            "width":barWidth,
                            opacity:1
                    });     

               
                barChart.exit().transition().duration(1000)
                       .attr("height", 0);

                
            }
    

            function donutExtract(){

                sDonut['all']=[0,0,0,0];
                for(i=0;i<donutdata.length;i++){
                    name=donutdata[i]['crop'].toLowerCase();
                    if(sDonut[name]==null){
                      sDonut[name]=[0,0,0,0];
                    }else{
                      if(donutdata[i]['forumid']=="Radio"){
                        sDonut[name][0]+=1;
                        sDonut['all'][0]+=1;
                      }else if(donutdata[i]['forumid']=="Questions and Answers"){
                        sDonut[name][1]+=1;
                        sDonut['all'][1]+=1;
                      }else if(donutdata[i]['forumid']=="Experience Sharing"){
                        sDonut[name][2]+=1;
                        sDonut['all'][2]+=1;
                      }else if(donutdata[i]['forumid']=="Announcements"){
                        sDonut[name][3]+=1;
                        sDonut['all'][3]+=1;
                      }
                    }
                }
                console.log(sDonut);
                dDonut['all']=[0,0,0,0];
                for(i=0;i<donutdata.length;i++){
                    name=donutdata[i]['crop'].toLowerCase();
                    if(dDonut[name]==null){
                      dDonut[name]=[0,0,0,0];
                    }else{
                      durations=donutdata[i]['duration'];
                      if(donutdata[i]['forumid']=="Radio"){
                        dDonut[name][0]+=durations;
                        dDonut['all'][0]+=durations;
                      }else if(donutdata[i]['forumid']=="Questions and Answers"){
                        dDonut[name][1]+=durations;
                        dDonut['all'][1]+=durations;
                      }else if(donutdata[i]['forumid']=="Experience Sharing"){
                        dDonut[name][2]+=durations;
                        dDonut['all'][2]+=durations;
                      }else if(donutdata[i]['forumid']=="Announcements"){
                        dDonut[name][3]+=durations;
                        dDonut['all'][3]+=durations;
                      }
                    }
                }
                console.log(dDonut);
            }

            function arcTween(a) {
                var i = d3.interpolate(this._current, a);
                this._current = i(0);
                return function(t) {
                  return arc(i(t));
                };
            }
