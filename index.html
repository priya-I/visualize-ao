                function drawcircle(cropselected){

            function filterDatabyYear(dat){
                start=new Date("9/3/2011");
                end=new Date("7/20/2012");
                var newdat=[];
               
                for(i=0;i<dat.length;i++){
                    tempdate=new Date(dat[i]['date']);
                    if(tempdate>start & tempdate<end){
                        newdat.push(dat[i]);
                    }    
                }
                return newdat;
            }

            function redraw(cropdata){

                barChart.exit().transition().duration(1000)
                       .attr("height", 0);

                
            }
    

            function donutExtract(){
                sDonut['all']=[0,0,0,0];
                for(i=0;i<donutdata.length;i++){
                    name=donutdata[i]['crop'].toLowerCase();
                    if(sDonut[name]==null){
                      sDonut[name]=[0,0,0,0];
                    }else{
                      if(donutdata[i]['forumid']=="Questions and Answers"){
                        sDonut[name][1]+=1;
                        sDonut['all'][1]+=1;
                      }else if(donutdata[i]['forumid']=="Experience Sharing"){
                        sDonut[name][2]+=1;
                        sDonut['all'][2]+=1;
                      }else if(donutdata[i]['forumid']=="Announcements"){
                        sDonut[name][3]+=1;
                        sDonut['all'][3]+=1;
                      }
                    }
                }
                console.log(sDonut);
                dDonut['all']=[0,0,0,0];
                for(i=0;i<donutdata.length;i++){
                    name=donutdata[i]['crop'].toLowerCase();
                    if(dDonut[name]==null){
                      dDonut[name]=[0,0,0,0];
                    }else{
                      durations=donutdata[i]['duration'];
                      if(donutdata[i]['forumid']=="Questions and Answers"){
                        dDonut[name][1]+=durations;
                        dDonut['all'][1]+=durations;
                      }else if(donutdata[i]['forumid']=="Experience Sharing"){
                        dDonut[name][2]+=durations;
                        dDonut['all'][2]+=durations;
                      }else if(donutdata[i]['forumid']=="Announcements"){
                        dDonut[name][3]+=durations;
                        dDonut['all'][3]+=durations;
                      }
                    }
                }
                console.log(dDonut);
            }

            function arcTween(a) {
                var i = d3.interpolate(this._current, a);
                this._current = i(0);
                return function(t) {
                  return arc(i(t));
                };
            }

            function plotMultiples(cropV,topicV){
            //Get the topic data from the finaldata.json
              var tlist={};
              for(i=0;i<linDat.length;i++){
                       content=String(linDat[i]['crop']);
                       if((content.toLowerCase()==cropV || cropV=='all') & linDat[i]['topic']==topicV){
                        weekno=linDat[i]['weekno']+","+linDat[i]['year'];
                         if(tlist[weekno]==null){
                            tlist[weekno]=1;
                          }else{
                            tlist[weekno]+=1;
                          }

                      }
                }
              
              linedata=[];
              for(key in tlist){
                  linedata.push(tlist[key]);
              }
              
              if(linedata.length<=5){
                return 0;
              }
              //Plot graph

              var enddate=new Date("5/19/2012");

              var w=200;
              var h=100;
              var margin=5;
              y = d3.scale.linear().domain([0, d3.max(linedata)]).range([0 + margin, h - margin]),
              //x = d3.time.scale().domain([startdate, enddate]).range([0 + margin, w - margin]);
              x = d3.scale.linear().domain([0, linedata.length]).range([0 + margin, w - margin]);
              var vis=d3.selectAll(".lines")
              .append("svg:svg")
              .attr("class","lineChart")
              .attr("width",w)
              .attr("height",h);

              var g=vis.append("svg:g")
              .attr("transform","translate(0,"+h+")")
              
              g.append("text")
              .attr("class","info")
              .text(topicV)
              .attr({
                "x":50,
                "y":-80
              });

              var line=d3.svg.line()
              .x(function(d,i){
                return x(i);
              })
              .y(function(d){
                return -1*y(d);
              });

              g.append("svg:path").attr("d",line(linedata))
              .attr("class","line");


              g.append("svg:line")
              .attr("x1", x(0))
              .attr("y1", -1 * y(0))
              .attr("x2", x(w))
              .attr("y2", -1 * y(0));
           
              g.append("svg:line")
                  .attr("x1", x(0))
                  .attr("y1", -1 * y(0))
                  .attr("x2", x(0))
                  .attr("y2", -1 * y(d3.max(linedata)));

              .attr("class", "xLabel")
              .text(String)

              .attr("x", function(d) { return x(d) })
              .attr("y", 0)
              .attr("text-anchor", "middle");
           
              g.selectAll(".yLabel")
              .data(y.ticks(5))
              .enter().append("svg:text")
              .attr("class", "yLabel")
              .text(String)
              .attr("class","line")
              .attr("x", 0)
              .attr("y", function(d) { return -1 * y(d) })
              .attr("text-anchor", "right")
              .attr("dy", 4);

              g.selectAll(".xTicks")
                .data(x.ticks(5))
                .enter().append("svg:line")
                .attr("class", "xTicks")
                .attr("x1", function(d) { return x(d); })
                .attr("y1", -1 * y(0))
                .attr("x2", function(d) { return x(d); })
                .attr("y2", -1 * y(-0.3));
                
             
            g.selectAll(".yTicks")
                .data(y.ticks(4))
                .enter().append("svg:line")
                .attr("class", "yTicks")
                .attr("y1", function(d) { return -1 * y(d); })
                .attr("x1", x(-0.3))
                .attr("y2", function(d) { return -1 * y(d); })
                .attr("x2", x(0));

              return 1;
          
      }
