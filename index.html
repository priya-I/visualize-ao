<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>Visualize-AO</title>
		<script type="text/javascript" src="d3/d3.v3.js"></script>
		<script type="text/javascript" src="bardata.json"></script>
		<link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
		<style type="text/css">
			
			.tick,.major{
				stroke-width:2;
			}
			.axis line {
				fill: none;
				stroke: red;
				shape-rendering: crispEdges;
			}
			
			.axis,.g text {
				font-family: sans-serif;
				font-size: 11px;
			}

			.domain { 
			  fill: none; 
			  stroke: black; 
			  stroke-width: 1; 
			} 
		</style>
	</head>

	<body>
		<script type="text/javascript">
		
			var ddata=bars;
        	var w=1000;
        	var h=700;
			var svg=d3.select("body")
					  .append("svg")
					  .attr("width",w)
				 	  .attr("height",h);


			var padding=30;
			/*heightScale=d3.scale.linear()
					.domain(0,d3.max(ddata,function(d){ return parseInt(d['sessions']); }))
					.range(0,h);*/	
			//Binding the data with the g element
			var elem=svg.selectAll("g")
						.data(ddata);
			//Adding co-ordinates to the data
			var elemEnter=elem.enter()
							  .append("g");
			
			//Setting the bar attributes
			var barPadding=1;
			var barWidth=(w/ddata.length)+barPadding;
			//Creating the scales
			var timescale=d3.scale.linear()
								 .domain([0,ddata.length])
								 .range([padding-barWidth,(barWidth*ddata.length)+padding]);

			var sessionscale=d3.scale.linear()
							  .domain([d3.min(ddata,function(d){ 
							  				sessions=parseInt(d['sessions']);
							  				return sessions; } )
							  		,d3.max(ddata,function(d){ 
							  				sessions=parseInt(d['sessions']);
							  				return sessions; } ) ] )
							  .range([h-padding,padding]);

			var colorScale=d3.scale.linear()
							.domain([d3.min(ddata,function(d){return parseInt(d['duration'])}),
									d3.max(ddata,function(d){return parseInt(d['duration'])})
								])
							.range([0,256]);


			//Creating the axes
			var xAxis = d3.svg.axis()
                  .scale(timescale)
                  .orient("bottom")
                  .ticks(5);
		
		
            //Adding the axes

            svg
			.append("g")
			//.style("class","axis")
			.attr("transform","translate(0,"+(h-padding)+")")
			.call(xAxis);
	
			svg
			.append("g")
		//.style("class","axis")
			.attr("transform","translate("+(w/ddata.length)+",0)")
			//.call(yAxis);
		
			

			var bars=elemEnter
					.append("rect")
					.attr({
					"x":function(d,i){
						return (i*21)+(w/ddata.length);
					},
					"y":function(d){
						sessions=parseInt(d['sessions'])/10;
						return h-sessions-30;
					},			
					
					"height":function(d,i){
						sessions=parseInt(d['sessions'])/10;
						return sessions;
					},
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(color)+",0,0)";
					},
					"width":(w/ddata.length)-barPadding,
					opacity:1
				});
		
			elemEnter.on("mouseover",function(){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":20,
					"fill":"black"
				})

			})
			.on("mouseout",function(){
				d3.select(this)
				.select("rect")
				.transition()
				.attr({
					"width":(w/ddata.length)-barPadding,
					"fill": function(d) {
						color=Math.round(colorScale(parseInt(d['duration'])));
    				  	return "rgb("+String(color)+",0,0)";
					}
				})
			})
	</script>
	</body>
</html>
