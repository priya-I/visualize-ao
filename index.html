        <div class="span9"> 
    	</div>

        <script type="text/javascript">
        	var alldata=All;
			var actualW=900;
			var extendedH=700;
	        var w=800;
	        var h=600;
	        var padding=20;
	        var barPadding=1;
	       	var svg=d3.selectAll(".span9")
						  .append("svg")
						  .attr("width",actualW)
					 	  .attr("height",extendedH);
					 	
			var barWidth=(w-padding)/alldata.length-barPadding;
				
			var startdate=d3.min(alldata,function(d){
					return new Date(d['ddate']);
			});
			
			var enddate=d3.max(alldata,function(d){
			   	return new Date(d['ddate']);
			});
				
			var minSess=d3.min(alldata,function(d){
				return parseInt(d['sessions']);
			})

			var maxSess=d3.max(alldata,function(d){
				return parseInt(d['sessions']);
			})

			var minDur=d3.min(alldata,function(d){
				return parseInt(d['duration']);
			})

			var maxDur=d3.max(alldata,function(d){
				return parseInt(d['duration']);
			})
			
			//Creating the scales
			var timescale=d3.time.scale()
						.domain([startdate,enddate]).nice()
						.range([padding,w+padding]);		

			var sessionscale=d3.scale.linear()
						  .domain([minSess,maxSess])
						  .range([h-padding,padding]);

			var colorScale=d3.scale.linear()
							.domain([minDur,maxDur])
							.range(["#FFEC8B", "#FF3300"])
							.interpolate(d3.interpolateLab);

			var cropMap=[]
			cropMap["cotton"]=Cotton
			cropMap["all"]=All
			cropMap["brinjal"]=Brinjal
			cropMap["castor"]=Castor
			cropMap["chilli"]=Chilli
			cropMap["cumin"]=Cumin
			cropMap["gram"]=Gram
			cropMap["garlic"]=Garlic
			cropMap["mustard"]=Mustard
			cropMap["onion"]=Onion
			cropMap["paddy"]=Paddy
			cropMap["wheat"]=Wheat
			cropMap["maize"]=Maize
			var cropname='all';
			var ddata=All;
				
			baseChart=svg.selectAll("#base g")
					.data(alldata)
					.enter()
					.append("g")
					.attr("class","base");					

			baseChart.append("rect")
					.attr({
						"x":function(d,i){
							relX=padding+i*(barWidth+barPadding);
							return relX;
						},
						"y":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return sessions;
						},			
						
						"height":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return h-padding-sessions;
						},
						"fill": "lightgrey",
						"width":barWidth,
						opacity:0.9
					});		


				//Main Crop Chart
				barChart=svg.selectAll("#main g")
						.data(ddata);

				barChart.enter()
					.append("g")
					.attr("class","main")
					.append("rect")
					
 				//barChart.enter().append("rect")
				barChart.select("rect")
						.transition().duration(500)
						.attr({
						"x":function(d,i){
							relX=padding+i*(barWidth+barPadding);
							return relX;
						},
						"y":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return sessions;
						},			
						
						"height":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return h-padding-sessions;
						},
						"fill": function(d) {
						  	return colorScale(parseInt(d['duration']));
						},
						"width":barWidth,
						opacity:1
					});		

				//Tooltip on mouse over
				var div=d3.select("body").append("div")
	            .attr("class","tooltip")
	            .style("opacity",0);

	            cropdat=svg.append("text")
	            .attr({

	            	"x":w/2-padding-100,
	            	"y":20
	            })
	            .style({
	            	"opacity":0,
	            	"wordWrap":"break-word"

	            })

				barChart.on("mouseover",function(d){
					d3.select(this)
					.select("rect")
					.transition()
					.attr({
						"width":15,
						"fill":"black"
					});
					div.transition()
						.style("opacity",.9)
					div.html(
						"Duration: "+d['duration']+" s, Sessions: "+d['sessions']+"<br/>"
						+"Time: "+d['date'])
						.style("left",(d3.event.pageX)+"px")
						.style("top",(d3.event.pageY)+"px");
					})
				.on("mouseout",function(){
					d3.select(this)
					.select("rect")
					.transition()
					.attr({
						"width":barWidth,
						"fill": function(d) {
						  	return colorScale(parseInt(d['duration']));
						}
					})
					div.transition()
					.duration(500)
					.style("opacity",0)
					
				})
				.on("click",function(d){
					cropdat.text(d['crops'])
					.transition()
					.duration(500)
					.style("opacity",1)
				})
				
			
				//Creating the axes
			    var xAxis = d3.svg.axis()
	                  .scale(timescale)
	                  .orient("bottom")
	               	  .ticks(d3.time.weeks,4)
	               	  //.ticks(0)
	                  .tickFormat(d3.time.format("Week %W, %y"));
	                             
	            
	            var yAxis = d3.svg.axis()
	            	.scale(sessionscale) 
	               	.tickSize(0,0,0)
	               	.ticks(5) 
	            	.orient("right");
	            	           
				 //Adding the X-axis
				XaxisGroup=svg.append("g")
						.attr("transform","translate(0,"+(h-padding)+")")
						.call(xAxis);

				XaxisGroup.selectAll("text")						
						.style("class","axistext")
						.attr({
							"transform":"rotate(-10)"
						})
						
				svg.append("text")
				.attr("class","x label")
				.attr("text-anchor","end")
				.attr("x",w/2)
				.attr("y",extendedH)
				.text("Weeks");

				svg.append("text")
			    .attr("class", "y label")
			    .attr("text-anchor", "end")
			    .attr("y", 6)
			    .attr("dy", ".75em")
			    .attr("transform", "rotate(-90)")
			    .text("No. of sessions");

				YaxisGroup=svg.append("g")
						.attr("transform","translate("+padding+",0)")
						.call(yAxis);	

				YaxisGroup.selectAll("text")						
						.style("class","axistext")
						.attr({
							"transform":"rotate(-10)"
					})

			d3.selectAll("a")
			.on("click",function(d){
				crop=d3.select(this).attr("id")
				cropname=crop
				change(cropname)
				cropdata=cropMap[crop]
				barChart.data(cropdata)
				.select("rect")
				.transition().duration(2000).delay(200)
				.attr({
						"x":function(d,i){
							relX=padding+i*(barWidth+barPadding);
							return relX;
						},
						"y":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return sessions;
						},			
						
						"height":function(d){
							sessions=sessionscale(parseInt(d['sessions']));
							return h-padding-sessions;
						},
						"fill": function(d) {
						  	return colorScale(parseInt(d['duration']));
						},
						"width":barWidth,
						opacity:1
					});		
			
			})
			
	</script>

	<div class="span3">
        
       
        <script >

	        var topicdata=cropstop
			var donutdata=_.groupBy(topicdata, function(d){
				//var retval=[]
				if(cropname=='all'){
					if(d['topic']!=""){
						return d['topic'];
					}
				}else if(d['crop'].toLowerCase()==cropname.toLowerCase()){
					if(d['topic']!=""){
						return [d['crop'],d['topic']];
					}
				}
				//return retval;
			});

			
	        var dataset=[];
	        var i=0;
	        for (i=1;i<_.values(donutdata).length; i++){
	        	dataset[_.keys(donutdata)[i]]= _.values(donutdata)[i].length;
	        }


		var width = 360,
		    height = 300,
		    radius = 150;

		var color = d3.scale.category10();

		var pie = d3.layout.pie()
		    .sort(null);

		var arc = d3.svg.arc()
		    .innerRadius(radius - 100)
		    .outerRadius(radius - 50);

		var svg = d3.selectAll(".span3").append("svg")
		    .attr("width", width)
		    .attr("height", height)
		    .append("g")
		    .attr("transform", "translate(" + width / 2 + "," + height / 2 + ")");

		var path = svg.selectAll("path")
		    .data(pie(_.values(dataset)))
		  	.enter().append("path")
		    .attr("fill", function(d, i) { return color(i); })
		    .attr("d", arc)
		    .style('opacity', 0.6)
		    .each(function(d){this._current=d;});    

			
			function change(cropname) {
				topicdata=cropstop
				donutdata=_.groupBy(topicdata, function(d){
					//var retval=[]
					if(cropname=='all'){
						return d['topic'];
					}else if(d['crop'].toLowerCase()==cropname.toLowerCase()){
						return [d['crop'],d['topic']];
					}
					//return retval;
				});

				dataset=[];
		        
		        for (i=1;i<_.values(donutdata).length; i++){
		        	dataset[_.keys(donutdata)[i]]= _.values(donutdata)[i].length;
		        }
		        console.log(dataset)
	            path = path.data(pie(_.values(dataset))); // update the data
			    //path.transition().ease("elastic").duration(750).attrTween("d", arcTween); // redraw the arcs
			     path.transition().ease("elastic").duration(750)
			     .attr("fill", function(d, i) { return color(i); })
		    	.attr("d", arc)
		    	.style('opacity', 0.6);
			}

			// Store the displayed angles in _current.
			// Then, interpolate from _current to the new angles.
			// During the transition, _current is updated in-place by d3.interpolate.
			function arcTween(a) {
				console.log(this._current)
			  	var i = d3.interpolate(this._current, a);
			  	this._current = i(0);
			 	 return function(t) {
			 		   return arc(i(t));
				  };
			}

		/*  path.append("text")
		      .attr("transform", function(d) { return "translate(" + arc.centroid(d) + ")"; })
		      .attr("dy", ".35em")
		      .style("text-anchor", "middle")
		      .text(function(d) { return dataset; });*/
    </script>
