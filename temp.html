<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Avaaj Otalo Data Visualization</title>
   
  </head>

  <body>
    <script type="text/javascript">
    var svg=d3.append("svg")
            .attr("width",800)
            .attr("height",600);
    var circle = svg.selectAll("circle")
    .data([32, 57, 293], String);

    circle.enter().append("circle")
        .attr("cy", 90)
        .attr("cx", String)
        .attr("r", Math.sqrt);
    
    circle.exit().remove();
    </script>
  </body>
</html>
